name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[lerobot]" build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Install wheel in isolated environment
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          with tempfile.TemporaryDirectory() as folder:
              env = pathlib.Path(folder) / "venv"
              venv.EnvBuilder(with_pip=True).create(env)
              python = env / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", "--no-deps", str(wheel)], check=True)
              subprocess.run([str(python), "-m", "episode_fence", "demo", "-o", "demo"], cwd=folder, check=True)
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: distributions
          path: dist/*
