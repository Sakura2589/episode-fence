[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "episode-fence"
version = "0.1.0"
description = "Catch temporal leakage in robot learning splits before training."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EpisodeFence contributors"}]
keywords = ["robotics", "lerobot", "dataset", "data-leakage", "validation"]
dependencies = []

[project.urls]
Repository = "https://github.com/Sakura2589/episode-fence"
Issues = "https://github.com/Sakura2589/episode-fence/issues"

[project.optional-dependencies]
lerobot = ["pyarrow>=14"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
episode-fence = "episode_fence.cli:main"

[tool.setuptools.packages.find]
include = ["episode_fence*"]

[tool.setuptools.package-data]
episode_fence = ["report.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
